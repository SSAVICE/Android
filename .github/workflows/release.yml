name: release apk

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  apk:
    name: Generate APK
    if: github.ref_type == 'tag' && github.event.base_ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Create local.properties
        run: |
          echo "${{ secrets.LOCAL_PROPERTIES }}" >> ./local.properties

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      #      - name: Build APK
      #        run: bash ./gradlew assembleDebug --stacktrace
      - name: Generate Keystore file from Github Secrets
        run: |
          echo "${{secrets.ENCODED_KEYSTORE_KEY}}" > ./keystore.b64
          base64 -d -i ./keystore.b64 > ./keystore.jks
          cp ./keystore.jks ./app/keystore.jks
          cp ./keystore.jks ./ssavice-seller/keystore.jks
      - name: Build User Signed APK
        run: |
          bash ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=${{secrets.PASS_KEYSTORE}} \
            -Pandroid.injected.signing.key.alias=${{secrets.ALIAS_KEY}} \
            -Pandroid.injected.signing.key.password=${{secrets.PASS_KEYSTORE_KEY}} \
            --stacktrace

      - name: Build Seller Signed APK
        run: |
          bash ./gradlew :ssavice-seller:assembleRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=${{secrets.PASS_KEYSTORE}} \
            -Pandroid.injected.signing.key.alias=${{secrets.ALIAS_KEY}} \
            -Pandroid.injected.signing.key.password=${{secrets.PASS_KEYSTORE_KEY}} \
            --stacktrace

      - name: Rename APK files
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/user-app-release.apk
          mv ssavice-seller/build/outputs/apk/release/ssavice-seller-release.apk app/build/outputs/apk/release/seller-app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/

  release:
    permissions: write-all
    name: Release APK
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: set now
        run: |
          echo "now=v$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_ENV
      - name: Download APK from build
        uses: actions/download-artifact@v4
        with:
          name: apk
      # 4. GitHub Release 생성 및 두 APK 업로드
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 자동으로 커밋 내역을 바탕으로 릴리스 노트를 생성해 줍니다.
          generate_release_notes: true
          files: |
            user-app-release.apk
            seller-app-release.apk

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # 쉘 스크립트와 JSON을 결합해 디스코드 임베드 메시지를 구성합니다.
          cat <<EOF > discord_payload.json
          {
            "content": "🚀 **새로운 앱 빌드가 배포되었습니다!**",
            "embeds": [
              {
                "title": "📦 Release ${{ github.ref_name }}",
                "url": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
                "color": 3447003,
                "description": "Seller 앱 및 User 앱의 Signed APK가 성공적으로 빌드되어 업로드되었습니다.",
                "fields": [
                  {
                    "name": "📱 판매자 앱 다운로드 ",
                    "value": "[👉 Seller App](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/seller-app-release.apk)",
                    "inline": true
                  },
                  {
                    "name": "🧑‍💻 유저 앱 다운로드 ",
                    "value": "[👉 User App](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/user-app-release.apk)",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "GitHub Actions CD Pipeline"
                }
              }
            ]
          }
          EOF
          
          # curl을 이용해 디스코드 웹훅으로 JSON 데이터를 전송합니다.
          curl -H "Content-Type: application/json" -X POST -d @discord_payload.json $DISCORD_WEBHOOK
